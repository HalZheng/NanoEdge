name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build src/NanoEdge/NanoEdge.csproj -c Release

      - name: Package
        shell: pwsh
        run: |
          $dir = "src/NanoEdge/bin/Release/net48"
          Compress-Archive -Path "$dir/NanoEdge.exe","$dir/NanoEdge.exe.config" -DestinationPath NanoEdge-${{ github.ref_name }}.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: NanoEdge-*.zip
          generate_release_notes: true
