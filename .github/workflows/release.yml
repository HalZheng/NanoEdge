name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build src/NanoEdge/NanoEdge.csproj -c Release

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: src/NanoEdge/bin/Release/net48/NanoEdge.exe
          generate_release_notes: true
